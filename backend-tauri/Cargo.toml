[package]
name = "cloud_loader"
version = "0.1.0"
edition = "2021"
authors = [
    "Ivenin Valentin <iveninvala7@gmail.com>",
]
description = "Backend for a cross-platform desktop application with Tauri."
repository = "https://github.com/IOSHED/Iosh__CloudLoader"

[lib]
name = "cloud_loader_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-beta", features = [] }

[dependencies]
tauri = { version = "2.0.0-beta", features = [] }
tauri-plugin-shell = "2.0.0-beta"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

