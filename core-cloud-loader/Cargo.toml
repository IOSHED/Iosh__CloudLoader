[package]
name = "core-cloud-loader"
version = "0.1.0"
edition = "2021"
authors = [
    "Ivenin Valentin <iveninvala7@gmail.com>",
]
description = "This library is designed for connecting to various cloud services and for uploading/downloading data from them."
repository = "https://github.com/IOSHED/Iosh__CloudLoader"

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = "1"
futures = "0.3.30"
async-trait = "0.1.80"
oauth2 = "4.0"
actix-web = "4.4.1"
webbrowser = "0.6"
serde_json = "1.0"
reqwest = { version = "0.12.5", features = ["json", "multipart"] }
tokio-util = { version = "0.7.11", features = ["codec", "io"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35.1", features = ["full"] }
